# Copy to .github/workflows/release.yml in any repo that ships a container image.
# Set `images:` and `context:` for that repo.
#
# Publishing only. It deliberately does NOT deploy: a green build is not a decision
# to run something on Server A. Deploying means bumping the pin in the compose file
# and running `docker compose up -d`, or deploy/rollback.sh.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sync-store
          # latest=false is NOT optional. metadata-action tags any semver push
          # :latest by default, and the rule in this ecosystem is that no server
          # ever runs a moving tag it did not opt into — ci.yml's compose check
          # enforces the other end of that.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: ./sync-store
          file: ./sync-store/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment note
        run: |
          {
            echo "### Published, not deployed"
            echo ""
            echo "To roll this out, bump the pin in"
            echo '`/etc/amber-infra/<service>/docker-compose.prod.yml` and run'
            echo '`docker compose up -d`, or use `deploy/rollback.sh <service> <tag>`.'
          } >> "$GITHUB_STEP_SUMMARY"

  # Server B app agents opt into Watchtower by running :stable, the only moving tag
  # in the system — and it moves only after `ci` is green and a version tag was
  # pushed. Core services (Amber, sync-store, Caddy) are exact-pinned and ignore it.
  # Delete this job in a repo whose image is core-only.
  stable:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag as :stable
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/sync-store"
          docker buildx imagetools create -t "$IMAGE:stable" "$IMAGE:$VERSION"
