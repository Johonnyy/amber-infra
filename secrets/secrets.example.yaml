# amber-infra secrets — the single source of truth for every generated .env file.
#
# The real copy lives at /etc/amber-infra/secrets.yaml, mode 0600, root:root, and is
# NEVER committed. This example is committed and contains only placeholders.
#
# Consumed by:
#   install/lib/secrets.sh   renders each app's .env and SYNC_STORE_KEYS
#   backup/backup-*.sh       reads targets, retention, and the offsite remote
#   deploy/rollback.sh       reads image references and the registry
#
# Read with `yq` (v4), which install.sh installs. There is deliberately no bash
# fallback parser: hand-rolled YAML parsing in shell is where this repo would rot.
#
# Generate every token with:  openssl rand -hex 32

version: 1

infra:
  acme_email: you@example.com
  # Every hostname below hangs off this. It is a placeholder on purpose: a domain is
  # something only you know, and an example that looks plausible is one you can half
  # update — set the apex here and then leave a stale `johnny.dev` in an app's own
  # `domain:` field, which is a certificate request for a host you do not own.
  primary_domain: CHANGEME.example
  timezone: America/New_York
  # Which server this file describes. Drives which services install.sh deploys:
  # `core` gets Caddy + sync-store; `app` gets Caddy + Watchtower.
  role: core # core | app
  # This box's label, matched against `apps.<name>.server` to decide what belongs
  # here. Free-form — "a", "b", a hostname, whatever you name your boxes. Defaults to
  # `a` when role is core and `b` when it is app, so an older file keeps working.
  #
  # An app whose `server` is unset, or set to a label no box claims, is treated as
  # belonging everywhere rather than nowhere: it is better to see an app you cannot
  # install here than to have it silently absent from the only screen that lists it.
  server: a

sync_store:
  # What apps put in *_SYNC_STORE_URL. install.sh serves the store at
  # sync.<primary_domain>, so this has to agree with that — status.sh warns when it
  # does not, because the failure is silent: apps register against a host nobody is
  # listening on and discovery just quietly returns nothing.
  url: https://sync.CHANGEME.example
  port: 8081 # loopback port Caddy proxies to
  image: ghcr.io/johonnyy/sync-store:0.1.0
  # Rendered into SYNC_STORE_KEYS as "amber:tok,Aperture:tok".
  # The `name` is what appears in the store's log; the token never is.
  #
  # Only list a caller that exists. `sync_store_token_for` mints and writes back an
  # entry the first time an app is installed, so pre-declaring one buys nothing and
  # costs two things: a live credential in your backups for a service that cannot use
  # it, and a CHANGEME that stops the store from starting at all (ensure_sync_store
  # refuses a placeholder in this list) until you generate a token nothing needs.
  keys:
    - name: amber
      token: CHANGEME-openssl-rand-hex-32
    - name: Aperture
      token: CHANGEME-openssl-rand-hex-32

caddy:
  image: caddy:2.8-alpine

# Declare an app when you are about to install it, not before.
#
# This file is copied verbatim to /etc/amber-infra/secrets.yaml and becomes your real
# configuration, so an entry here is a claim that the app exists. An app that has not
# been built yet costs you a phantom row in every status report, a set of CHANGEMEs in
# the "still to do" list that nobody can fill, and an install that stops at "no compose
# file" — because there is no such directory in this repo to provide one.
#
# The template for the next app is at the bottom of this file, commented out.
apps:
  amber:
    # Must match a real A record. Caddy requests a certificate for exactly this name.
    domain: amber.CHANGEME.example
    upstream: 127.0.0.1:8000
    managed_by: docker
    image: ghcr.io/johonnyy/amber:0.1.0
    server: a
    # Under which prefix install.sh writes _PUBLIC_URL, _SYNC_STORE_URL and
    # _SYNC_STORE_TOKEN. The full prefix, MCP segment included — not just "AMBER".
    # Omit it and you get AGENT_MCP, which is right for every app that embeds only
    # agent-mcp-py and wrong for one that also embeds agent-runtime.
    env_prefix: AMBER_MCP
    # Amber owns a single AMBER_ prefix for three consumers (herself, agent_runtime,
    # agent_mcp) — never add AGENT_MCP_* or AGENT_RUNTIME_* keys here, they would be
    # ignored. See amber_v2/app/config.py.
    env:
      # STT (Whisper) + TTS.
      AMBER_OPENAI_API_KEY: CHANGEME
      # The brain, via OpenRouter through agent-runtime. Required unless
      # AMBER_FEATURE_LLM=false.
      AMBER_OPENROUTER_API_KEY: CHANGEME
      # Required on the WS handshake once she is publicly reachable.
      AMBER_AUTH_SECRET: CHANGEME-openssl-rand-hex-32
      AMBER_TIMEZONE: America/New_York
      # The database moves onto a named volume when containerised — see
      # deploy/migrate-amber-db.sh. This path is inside the container.
      AMBER_MEMORY_DB_PATH: /data/amber.db
      # Bearer tokens OTHER agents present to query Amber's MCP server. Without at
      # least one, agent-mcp-py fails closed and the server is simply not mounted.
      AMBER_MCP_KEYS: "Aperture:CHANGEME"
      # Peers Amber may CALL, as "name=https://host" pairs. A HOST, not an endpoint:
      # the client appends /mcp/ itself, so pasting the endpoint here gives /mcp/mcp/
      # and a 404 that reads exactly like the peer being down.
      #
      # Don't fill these two by hand. `install/connect-peer.sh --from amber --to bloom`
      # reads the pairing out of both manifests, mints or reuses the bearer, merges
      # both lists rather than clobbering them, and publishes the token to the
      # registry — and Aperture's Servers tab is one button over the same script.
      #
      # This is an OVERRIDE now, not the only source, and the history is worth
      # knowing because the failure had no symptom: Amber's broker used to be built
      # from `load_static_peers(AMBER_MCP_PEERS)` alone and handed that same dict as
      # the resolver, which short-circuits agent_mcp's registry. So Bloom registered
      # perfectly, appeared in `GET /servers`, and was offered to her as nothing at
      # all. She now unions this with the sync store's discovered layer
      # (amber_v2/app/peers.py), with this winning — so it is how you PIN a peer
      # during an incident rather than how you make one reachable.
      AMBER_MCP_PEERS: "bloom=https://bloom.CHANGEME.example"
      # The bearer she presents to those peers. It must equal the token in Bloom's
      # own BLOOM_MCP_KEYS ("amber:<token>") — two CHANGEMEs that have to be filled
      # with the SAME value, and it is the token HALF, not "amber:<token>". A
      # mismatch is a 401 on every delegated task.
      #
      # ONE token covers EVERY peer in the map above. Two peers wanting different
      # bearers cannot be expressed here at all; the registry's per-server credential
      # is what handles that, which is why connect-peer.sh publishes there too.
      AMBER_MCP_PEER_TOKEN: CHANGEME-openssl-rand-hex-32
      #
      # AMBER_MCP_PUBLIC_URL, AMBER_MCP_SYNC_STORE_URL, AMBER_MCP_SYNC_STORE_TOKEN and
      # AMBER_UPDATE_COMMAND are deliberately absent.
      #
      # install.sh derives all four and writes them into the rendered .env *after*
      # secrets_render_env, so anything set here is overwritten on every install. They
      # used to be listed with a note saying so, which was worse than leaving them out:
      # a CHANGEME in a value nobody can meaningfully fill reads as an outstanding task
      # in every checklist that scans this file.
      #
      # See install/install.sh, "Wiring $APP into the sync-store".

  bloom:
    # Where reusable agent configurations are defined and run. Amber delegates a
    # task here over MCP; Aperture edits the configs over REST. Core service, so
    # Server A beside Amber and the sync-store.
    domain: bloom.CHANGEME.example
    upstream: 127.0.0.1:8010
    managed_by: docker
    image: ghcr.io/johonnyy/bloom:0.1.0
    server: a
    # Like Amber, Bloom embeds both libraries and owns a single BLOOM_ prefix,
    # building each library's settings from it with _env_file=None. AGENT_MCP_* or
    # AGENT_RUNTIME_* keys below would be silently ignored — see bloom/app/config.py.
    env_prefix: BLOOM_MCP
    env:
      # Every configured agent runs through OpenRouter via agent-runtime. Without
      # it the admin API still serves, which is deliberate: editing configurations
      # before you have a key is a real workflow.
      BLOOM_OPENROUTER_API_KEY: CHANGEME
      # Bearer tokens OTHER agents present to call run_task. Amber is the caller
      # that matters; the same value has to reach her, via
      #   PUT https://sync.<primary_domain>/servers/bloom/token
      BLOOM_MCP_KEYS: "amber:CHANGEME-openssl-rand-hex-32"
      # Bearer tokens APERTURE presents to /admin. Deliberately a different set:
      # the GUI edits configuration, a peer agent spends money, and one leaked
      # token must not buy both.
      BLOOM_ADMIN_KEYS: "Aperture:CHANGEME-openssl-rand-hex-32"
      # Inside the container, on the bloom-data volume. Holds agent configs, the
      # encrypted OAuth grants, run history, and both usage tables as co-tenants.
      BLOOM_DB_PATH: /data/bloom.db
      # Encryption at rest for OAuth tokens. Comma-separated, NEWEST FIRST: the
      # head encrypts, all of them decrypt, so rotating is prepend-and-restart
      # rather than a migration. Generate with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # NOT openssl rand -hex 32 — Fernet wants its own 32-byte urlsafe-base64 key
      # and rejects anything else at startup.
      #
      # Losing this key does not lose the connections politely: the rows survive,
      # unreadable, and every account has to be re-authorised through a browser one
      # at a time. It is in your backups only because this file is.
      BLOOM_FERNET_KEYS: CHANGEME-fernet-generate-key
      BLOOM_FEATURE_OAUTH: "true"
      #
      # Per-provider client credentials are OPTIONAL here, and usually unnecessary.
      #
      # A connection carries its own client id and secret, entered in Aperture and
      # encrypted at rest — so connecting a provider is a form, not a deploy. Set a
      # pair here only to share one registered app across every connection to that
      # provider; a connection's own credentials win over it. The names come from
      # each manifest in bloom/app/providers/*.toml, not from a BLOOM_ prefix,
      # because the set of providers is not known when the settings class is defined.
      #   BLOOM_OAUTH_SPOTIFY_CLIENT_ID: CHANGEME
      #   BLOOM_OAUTH_SPOTIFY_CLIENT_SECRET: CHANGEME
      #
      # BLOOM_MCP_PUBLIC_URL, BLOOM_MCP_SYNC_STORE_URL, BLOOM_MCP_SYNC_STORE_TOKEN and
      # BLOOM_PUBLIC_URL are deliberately absent — bloom/manifest.yaml declares all
      # four as `derived`, so install.sh writes them after secrets_render_env and
      # anything set here is overwritten on every install.
      #
      # BLOOM_PUBLIC_URL is the origin an OAuth provider redirects the browser back
      # to, registered with each provider as https://<this>/admin/oauth/<p>/callback.
      # It is exactly `https://<domain>`, so it used to be a hand-maintained CHANGEME
      # that could disagree with the host Caddy actually serves.
backup:
  target: /var/backups/amber-infra
  retention_days: 14
  # Never fall below this many snapshots per name, however old they are. A two-week
  # outage must not leave you with zero backups.
  keep_minimum: 7
  sqlite:
    # A container target runs `.backup` inside the container, then docker cp's it
    # out. A `cp` of a WAL database is a corrupt snapshot — see backup-sqlite.sh.
    - container: amber
      path: /data/amber.db
      name: amber
    - container: sync-store
      path: /data/sync-store.db
      name: sync-store
    # bloom.db is the one snapshot here that cannot be reconstructed from anywhere
    # else. Agent configs could be retyped; the OAuth grants could not — restoring
    # those means re-authorising every connected account through a browser, one at
    # a time. Same WAL + co-tenant-writers shape as amber.db, so `.backup` inside
    # the container rather than a cp.
    - container: bloom
      path: /data/bloom.db
      name: bloom
  volumes:
    # Tarred, not sqlite-dumped. caddy-data holds the ACME certs and account key;
    # losing it burns Let's Encrypt rate limit on re-issue.
    - caddy-data
  # None yet. The key exists so the first Postgres app inherits a contract rather
  # than inventing one.
  postgres: []
  # e.g. "b2:johnny-backups". Empty disables offsite copies.
  rclone_remote: ""

github:
  owner: Johonnyy
  registry: ghcr.io

# --- the next app ------------------------------------------------------------
#
# Uncomment, rename, and fill in — or press Declare in Aperture's Servers tab, which
# writes this same stanza and mints the AGENT_MCP_KEYS token for you.
#
# Two things are needed beyond this block, and install.sh checks both:
#
#   * `<name>/docker-compose.prod.yml` committed to THIS repo. There is no generic
#     template: an app's volume, health check and port binding are its own, and a
#     rendered guess is how you get a container that starts and stores nothing.
#   * DNS for the domain already pointing at the box, because Caddy asks for a
#     certificate the moment the site block appears.
#
# Note the prefix, and set `env_prefix` if it is not the default. A plain
# agent-mcp-py consumer reads AGENT_MCP_* and needs nothing here. An app that embeds
# agent-runtime as well owns a single prefix of its own and builds both libraries'
# settings from it — Amber (AMBER_MCP) and Bloom (BLOOM_MCP) both do. Guessing wrong
# fails silently: the keys land under a prefix the app ignores, so it starts, serves,
# and never registers with the sync-store, and nothing says why.
#
#  finance:
#    domain: finance.CHANGEME.example
#    upstream: 127.0.0.1:8090
#    managed_by: docker
#    image: ghcr.io/johonnyy/finance-agent:0.1.0
#    server: b
#    # Omit for a plain agent-mcp-py app; the default AGENT_MCP is correct.
#    # env_prefix: AGENT_MCP
#    env:
#      # The bearer token Amber presents when calling this app. The same value has to
#      # reach her, via: PUT https://sync.<primary_domain>/servers/finance/token
#      AGENT_MCP_KEYS: "amber:CHANGEME-openssl-rand-hex-32"
