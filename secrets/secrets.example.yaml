# amber-infra secrets — the single source of truth for every generated .env file.
#
# The real copy lives at /etc/amber-infra/secrets.yaml, mode 0600, root:root, and is
# NEVER committed. This example is committed and contains only placeholders.
#
# Consumed by:
#   install/lib/secrets.sh   renders each app's .env and SYNC_STORE_KEYS
#   backup/backup-*.sh       reads targets, retention, and the offsite remote
#   deploy/rollback.sh       reads image references and the registry
#
# Read with `yq` (v4), which install.sh installs. There is deliberately no bash
# fallback parser: hand-rolled YAML parsing in shell is where this repo would rot.
#
# Generate every token with:  openssl rand -hex 32

version: 1

infra:
  acme_email: you@example.com
  primary_domain: johnny.dev
  timezone: America/New_York
  # Which server this file describes. Drives which services install.sh deploys:
  # `core` gets Caddy + sync-store; `app` gets Caddy + Watchtower.
  role: core # core | app
  # This box's label, matched against `apps.<name>.server` to decide what belongs
  # here. Free-form — "a", "b", a hostname, whatever you name your boxes. Defaults to
  # `a` when role is core and `b` when it is app, so an older file keeps working.
  #
  # An app whose `server` is unset, or set to a label no box claims, is treated as
  # belonging everywhere rather than nowhere: it is better to see an app you cannot
  # install here than to have it silently absent from the only screen that lists it.
  server: a

sync_store:
  url: https://sync.johnny.dev # what apps put in *_SYNC_STORE_URL
  port: 8081 # loopback port Caddy proxies to
  image: ghcr.io/johonnyy/sync-store:0.1.0
  # Rendered into SYNC_STORE_KEYS as "amber:tok,Aperture:tok".
  # The `name` is what appears in the store's log; the token never is.
  #
  # Only list a caller that exists. `sync_store_token_for` mints and writes back an
  # entry the first time an app is installed, so pre-declaring one buys nothing and
  # costs two things: a live credential in your backups for a service that cannot use
  # it, and a CHANGEME that stops the store from starting at all (ensure_sync_store
  # refuses a placeholder in this list) until you generate a token nothing needs.
  keys:
    - name: amber
      token: CHANGEME-openssl-rand-hex-32
    - name: Aperture
      token: CHANGEME-openssl-rand-hex-32

caddy:
  image: caddy:2.8-alpine

# Declare an app when you are about to install it, not before.
#
# This file is copied verbatim to /etc/amber-infra/secrets.yaml and becomes your real
# configuration, so an entry here is a claim that the app exists. An app that has not
# been built yet costs you a phantom row in every status report, a set of CHANGEMEs in
# the "still to do" list that nobody can fill, and an install that stops at "no compose
# file" — because there is no such directory in this repo to provide one.
#
# The template for the next app is at the bottom of this file, commented out.
apps:
  amber:
    domain: amber.johnny.dev
    upstream: 127.0.0.1:8000
    managed_by: docker
    image: ghcr.io/johonnyy/amber:0.1.0
    server: a
    # Amber owns a single AMBER_ prefix for three consumers (herself, agent_runtime,
    # agent_mcp) — never add AGENT_MCP_* or AGENT_RUNTIME_* keys here, they would be
    # ignored. See amber_v2/app/config.py.
    env:
      # STT (Whisper) + TTS.
      AMBER_OPENAI_API_KEY: CHANGEME
      # The brain, via OpenRouter through agent-runtime. Required unless
      # AMBER_FEATURE_LLM=false.
      AMBER_OPENROUTER_API_KEY: CHANGEME
      # Required on the WS handshake once she is publicly reachable.
      AMBER_AUTH_SECRET: CHANGEME-openssl-rand-hex-32
      AMBER_TIMEZONE: America/New_York
      # The database moves onto a named volume when containerised — see
      # deploy/migrate-amber-db.sh. This path is inside the container.
      AMBER_MEMORY_DB_PATH: /data/amber.db
      # Bearer tokens OTHER agents present to query Amber's MCP server. Without at
      # least one, agent-mcp-py fails closed and the server is simply not mounted.
      AMBER_MCP_KEYS: "Aperture:CHANGEME"
      #
      # AMBER_MCP_PUBLIC_URL, AMBER_MCP_SYNC_STORE_URL, AMBER_MCP_SYNC_STORE_TOKEN and
      # AMBER_UPDATE_COMMAND are deliberately absent.
      #
      # install.sh derives all four and writes them into the rendered .env *after*
      # secrets_render_env, so anything set here is overwritten on every install. They
      # used to be listed with a note saying so, which was worse than leaving them out:
      # a CHANGEME in a value nobody can meaningfully fill reads as an outstanding task
      # in every checklist that scans this file.
      #
      # See install/install.sh, "Wiring $APP into the sync-store".
backup:
  target: /var/backups/amber-infra
  retention_days: 14
  # Never fall below this many snapshots per name, however old they are. A two-week
  # outage must not leave you with zero backups.
  keep_minimum: 7
  sqlite:
    # A container target runs `.backup` inside the container, then docker cp's it
    # out. A `cp` of a WAL database is a corrupt snapshot — see backup-sqlite.sh.
    - container: amber
      path: /data/amber.db
      name: amber
    - container: sync-store
      path: /data/sync-store.db
      name: sync-store
  volumes:
    # Tarred, not sqlite-dumped. caddy-data holds the ACME certs and account key;
    # losing it burns Let's Encrypt rate limit on re-issue.
    - caddy-data
  # None yet. The key exists so the first Postgres app inherits a contract rather
  # than inventing one.
  postgres: []
  # e.g. "b2:johnny-backups". Empty disables offsite copies.
  rclone_remote: ""

github:
  owner: Johonnyy
  registry: ghcr.io

# --- the next app ------------------------------------------------------------
#
# Uncomment, rename, and fill in — or press Declare in Aperture's Servers tab, which
# writes this same stanza and mints the AGENT_MCP_KEYS token for you.
#
# Two things are needed beyond this block, and install.sh checks both:
#
#   * `<name>/docker-compose.prod.yml` committed to THIS repo. There is no generic
#     template: an app's volume, health check and port binding are its own, and a
#     rendered guess is how you get a container that starts and stores nothing.
#   * DNS for the domain already pointing at the box, because Caddy asks for a
#     certificate the moment the site block appears.
#
# Note the prefix. Amber owns a single AMBER_ prefix for three consumers and builds
# both libraries' settings from it; every other app is a plain agent-mcp-py consumer
# and reads AGENT_MCP_*.
#
#  finance:
#    domain: finance.johnny.dev
#    upstream: 127.0.0.1:8090
#    managed_by: docker
#    image: ghcr.io/johonnyy/finance-agent:0.1.0
#    server: b
#    env:
#      # The bearer token Amber presents when calling this app. The same value has to
#      # reach her, via: PUT https://sync.johnny.dev/servers/finance/token
#      AGENT_MCP_KEYS: "amber:CHANGEME-openssl-rand-hex-32"
