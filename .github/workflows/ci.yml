# This repo's own CI: the ci-templates/ci.yml test job, plus three validation jobs
# that only make sense here.
#
# Those three are config validation, not Python lint — they do not reopen the
# "should we adopt ruff" question. They exist because this repo's failure mode is
# different from a library's: a broken Caddyfile or an unpinned image does not fail
# a test, it fails at 3am on a server.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: sync-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sync-store/pyproject.toml
      # The dev extra pulls agent-mcp-py from git — that is what
      # tests/test_contract_agent_mcp.py drives against a live store, and the only
      # thing keeping app/auth.py's mirrored copy honest.
      - run: pip install -e ".[dev]"
      - run: pytest -q

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      # -x makes shellcheck follow `. install/lib/common.sh`. Without it every
      # shared helper is reported as an unknown command and the output is noise.
      - run: shellcheck -x $(git ls-files '*.sh')
      # connect-peer.sh takes bearer lists apart and puts them back together, which
      # is the one kind of code here that fails silently: a merge that drops an entry
      # revokes a credential and still prints " ok". Needs no yq, docker or network.
      - run: bash tests/list-helpers.sh

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same binary install.sh puts on a box, so a manifest that lints here
      # cannot fail to parse there.
      - name: Install yq (v4)
        run: |
          sudo curl -fsSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - name: Every app declares what it needs, and says so consistently
        # The checks are in install/lib/manifest.sh rather than inline here, so that
        # everything which knows the manifest format is one file you can read top to
        # bottom — and so the same command runs locally.
        #
        # The one that earns its keep is the assertion that each app's three derived
        # keys are literally ${env_prefix}_PUBLIC_URL / _SYNC_STORE_URL /
        # _SYNC_STORE_TOKEN. A wrong prefix is invisible at runtime: both apps'
        # Settings classes use extra="ignore", so keys in the wrong namespace are not
        # an error, they are simply never read, and the app starts, serves, never
        # mounts its MCP server and never registers. Comparing the prefix against the
        # key names on every push is what makes that unrepresentable rather than
        # merely unlikely.
        run: bash -c '. install/lib/manifest.sh && manifest_lint_all'
      - name: declare.sh rehearses cleanly for every app in the example
        # Cheap, and it exercises the whole declare path — manifest parse, prefix
        # resolution, placeholder seeding — against the committed example rather than
        # against a fixture that can quietly stop resembling it.
        #
        # --dry-run writes nothing, but it runs on a copy anyway: a rehearsal that
        # needs the real file to be safe is one bad flag away from not being.
        run: |
          set -eu
          cp secrets/secrets.example.yaml /tmp/secrets.yaml
          for d in */manifest.yaml; do
            app="$(dirname "$d")"
            echo "== $app"
            bash install/declare.sh --app "$app" --reconcile --dry-run --secrets /tmp/secrets.yaml
          done
          bash install/fill-secrets.sh --dry-run --secrets /tmp/secrets.yaml
          if ! diff -q secrets/secrets.example.yaml /tmp/secrets.yaml; then
            echo "::error::a --dry-run modified the secrets file"
            exit 1
          fi
      - name: connect-peer.sh rehearses cleanly for every declared pairing
        # The pairings are read out of the manifests, so this needs no fixture and no
        # list of app names: any `peer_token` key with a `peer_of` is a link somebody
        # is expected to be able to make, and it should rehearse without dying.
        #
        # --no-registry because CI has no sync-store. That flag skips only the token
        # PUT; every manifest lookup, stanza check and list merge above it still runs,
        # which is the part that can be wrong.
        run: |
          set -eu
          cp secrets/secrets.example.yaml /tmp/peers.yaml
          found=0
          for d in */manifest.yaml; do
            app="$(dirname "$d")"
            for key in $(yq -r '.keys[]? | select(.kind == "peer_token") | .name' "$d"); do
              to="$(yq -r ".keys[] | select(.name == \"$key\") | .peer_of // \"\"" "$d")"
              [ -n "$to" ] || continue
              echo "== $app -> $to"
              found=$((found + 1))
              bash install/connect-peer.sh --from "$app" --to "$to" \
                --no-registry --dry-run --secrets /tmp/peers.yaml
            done
          done
          [ "$found" -gt 0 ] || { echo "::error::no peer_token key declares a peer_of"; exit 1; }
          if ! diff -q secrets/secrets.example.yaml /tmp/peers.yaml; then
            echo "::error::a --dry-run modified the secrets file"
            exit 1
          fi

  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Caddyfile with every snippet rendered
        # Snippets carry {{DOMAIN}}/{{APP_NAME}}/{{UPSTREAM}} rather than literal
        # hostnames now, because install.sh supplies those. Adapting them raw fails
        # with "subject does not qualify for certificate", which is the adapter
        # correctly refusing a template. So render them exactly as caddy_add_site
        # does, and validate what a real box would actually get.
        run: |
          set -eu
          mkdir -p /tmp/caddy/snippets
          cp caddy/Caddyfile /tmp/caddy/Caddyfile
          for s in caddy/snippets/*.caddy; do
            n="$(basename "$s" .caddy)"; n="${n#_}"
            sed -e "s|{{DOMAIN}}|$n.ci.example|g" \
                -e "s|{{APP_NAME}}|$n|g" \
                -e "s|{{UPSTREAM}}|127.0.0.1:9000|g" \
                "$s" > "/tmp/caddy/snippets/$n.caddy"
          done
          if grep -rq '{{' /tmp/caddy/snippets; then
            echo "::error::a snippet uses a placeholder caddy_add_site does not substitute"
            grep -rn '{{' /tmp/caddy/snippets
            exit 1
          fi
          docker run --rm -v /tmp/caddy:/etc/caddy -e ACME_EMAIL=ci@example.com \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every compose file
        # Each prod compose file names an env_file that secrets_render_env writes at
        # install time from secrets.yaml — deliberately never committed, since it
        # holds every secret the app has. `docker compose config` checks the file
        # EXISTS, so validating a clean checkout needs empty stand-ins.
        run: |
          set -eu
          for f in $(git ls-files '*docker-compose*.yml'); do
            echo "== $f"
            d="$(dirname "$f")"
            sed -n 's|^[[:space:]]*-[[:space:]]*\./\([^[:space:]#]*\.env\).*|\1|p' "$f" \
              | while read -r e; do [ -f "$d/$e" ] || : > "$d/$e"; done
            ACME_EMAIL=ci@example.com docker compose -f "$f" config -q
          done
      - name: Production compose files must pin an explicit, non-latest tag
        # The rule, enforced. Without this it stays true only for as long as
        # somebody remembers it.
        run: |
          if git ls-files '*docker-compose.prod.yml' | xargs -r grep -nE 'image:.*(:latest$|:latest[[:space:]])'; then
            echo "::error::production compose files must not use :latest"
            exit 1
          fi
          if git ls-files '*docker-compose.prod.yml' | xargs -r grep -nE 'image:[[:space:]]*[^:[:space:]]+[[:space:]]*$'; then
            echo "::error::production compose files must pin an explicit tag"
            exit 1
          fi
