# This repo's own CI: the ci-templates/ci.yml test job, plus three validation jobs
# that only make sense here.
#
# Those three are config validation, not Python lint — they do not reopen the
# "should we adopt ruff" question. They exist because this repo's failure mode is
# different from a library's: a broken Caddyfile or an unpinned image does not fail
# a test, it fails at 3am on a server.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: sync-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sync-store/pyproject.toml
      # The dev extra pulls agent-mcp-py from git — that is what
      # tests/test_contract_agent_mcp.py drives against a live store, and the only
      # thing keeping app/auth.py's mirrored copy honest.
      - run: pip install -e ".[dev]"
      - run: pytest -q

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      # -x makes shellcheck follow `. install/lib/common.sh`. Without it every
      # shared helper is reported as an unknown command and the output is noise.
      - run: shellcheck -x $(git ls-files '*.sh')

  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Caddyfile with every snippet rendered
        # Snippets carry {{DOMAIN}}/{{APP_NAME}}/{{UPSTREAM}} rather than literal
        # hostnames now, because install.sh supplies those. Adapting them raw fails
        # with "subject does not qualify for certificate", which is the adapter
        # correctly refusing a template. So render them exactly as caddy_add_site
        # does, and validate what a real box would actually get.
        run: |
          set -eu
          mkdir -p /tmp/caddy/snippets
          cp caddy/Caddyfile /tmp/caddy/Caddyfile
          for s in caddy/snippets/*.caddy; do
            n="$(basename "$s" .caddy)"; n="${n#_}"
            sed -e "s|{{DOMAIN}}|$n.ci.example|g" \
                -e "s|{{APP_NAME}}|$n|g" \
                -e "s|{{UPSTREAM}}|127.0.0.1:9000|g" \
                "$s" > "/tmp/caddy/snippets/$n.caddy"
          done
          if grep -rq '{{' /tmp/caddy/snippets; then
            echo "::error::a snippet uses a placeholder caddy_add_site does not substitute"
            grep -rn '{{' /tmp/caddy/snippets
            exit 1
          fi
          docker run --rm -v /tmp/caddy:/etc/caddy -e ACME_EMAIL=ci@example.com \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every compose file
        # Each prod compose file names an env_file that secrets_render_env writes at
        # install time from secrets.yaml — deliberately never committed, since it
        # holds every secret the app has. `docker compose config` checks the file
        # EXISTS, so validating a clean checkout needs empty stand-ins.
        run: |
          set -eu
          for f in $(git ls-files '*docker-compose*.yml'); do
            echo "== $f"
            d="$(dirname "$f")"
            sed -n 's|^[[:space:]]*-[[:space:]]*\./\([^[:space:]#]*\.env\).*|\1|p' "$f" \
              | while read -r e; do [ -f "$d/$e" ] || : > "$d/$e"; done
            ACME_EMAIL=ci@example.com docker compose -f "$f" config -q
          done
      - name: Production compose files must pin an explicit, non-latest tag
        # The rule, enforced. Without this it stays true only for as long as
        # somebody remembers it.
        run: |
          if git ls-files '*docker-compose.prod.yml' | xargs -r grep -nE 'image:.*(:latest$|:latest[[:space:]])'; then
            echo "::error::production compose files must not use :latest"
            exit 1
          fi
          if git ls-files '*docker-compose.prod.yml' | xargs -r grep -nE 'image:[[:space:]]*[^:[:space:]]+[[:space:]]*$'; then
            echo "::error::production compose files must pin an explicit tag"
            exit 1
          fi
